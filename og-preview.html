<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }

    body {
      width: 1200px;
      height: 630px;
      background: #0a0a0f;
      font-family: 'Inter Tight', 'Inter', system-ui, sans-serif;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Subtle gradient light leak top-left */
    .light-leak {
      position: absolute;
      top: -180px;
      left: -100px;
      width: 600px;
      height: 600px;
      background: radial-gradient(ellipse at center, rgba(31,102,208,0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Subtle gradient light leak bottom-right */
    .light-leak-2 {
      position: absolute;
      bottom: -200px;
      right: -80px;
      width: 500px;
      height: 500px;
      background: radial-gradient(ellipse at center, rgba(180,60,220,0.10) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Grain overlay */
    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 256px 256px;
      pointer-events: none;
    }

    /* Border frame */
    .frame {
      position: absolute;
      inset: 32px;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      pointer-events: none;
    }

    /* Main content */
    .content {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 0 80px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* Logo row */
    .logo-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 52px;
    }

    .logomark {
      width: 44px;
      height: 44px;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .logo-name {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #22d3ee, #d946ef, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .logo-sub {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      line-height: 1;
    }

    /* Eyebrow */
    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-bottom: 20px;
    }

    /* Headline */
    .headline {
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 0.92;
      color: #ffffff;
      margin-bottom: 36px;
    }

    .headline span {
      background: linear-gradient(90deg, #ffffff 0%, rgba(255,255,255,0.55) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Bottom row */
    .bottom-row {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.04);
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22d3ee;
    }

    .url {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.25);
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800;900&family=Inter:wght@500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="light-leak"></div>
  <div class="light-leak-2"></div>
  <div class="grain"></div>
  <div class="frame"></div>

  <div class="content">
    <div class="logo-row">
      <!-- PRSM Logomark SVG -->
      <svg class="logomark" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lg1" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#22d3ee"/>
            <stop offset="50%" stop-color="#d946ef"/>
            <stop offset="100%" stop-color="#fbbf24"/>
          </linearGradient>
        </defs>
        <polygon points="22,4 40,14 40,30 22,40 4,30 4,14" fill="none" stroke="url(#lg1)" stroke-width="1.5"/>
        <polygon points="22,10 34,17 34,27 22,34 10,27 10,17" fill="none" stroke="url(#lg1)" stroke-width="1" opacity="0.4"/>
        <circle cx="22" cy="22" r="3" fill="url(#lg1)"/>
      </svg>
      <div class="logo-text">
        <div class="logo-name">PrsmStudios</div>
        <div class="logo-sub">Digital Consulting</div>
      </div>
    </div>

    <div class="eyebrow">Venture Studio · Brand Reframing · Experience Engineering</div>

    <div class="headline">
      We build what<br/><span>refuses to be ignored.</span>
    </div>

    <div class="bottom-row">
      <div class="pill">
        <div class="pill-dot"></div>
        Available for new ventures
      </div>
      <div class="url">prsmstudios.io</div>
    </div>
  </div>
</body>
</html>
